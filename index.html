<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Belote</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#1a5c2a}
body{display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',Arial,sans-serif}
#game{position:relative;width:420px;height:680px;background:radial-gradient(ellipse at center,#2d7a3a 0%,#1a5c2a 100%)}

/* SCORES */
#scores{position:absolute;top:6px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:10}
.sbox{background:rgba(0,0,0,0.55);border-radius:8px;padding:3px 12px;text-align:center;min-width:72px;border:1px solid rgba(255,255,255,0.15)}
.sbox .lbl{font-size:9px;color:#8db;text-transform:uppercase;letter-spacing:1px}
.sbox .val{font-size:20px;font-weight:700;color:#fff;line-height:1.2}
.sbox.pending .val{color:#ffd700}

/* ATOUT */
#trump-ind{position:absolute;top:8px;right:8px;background:rgba(0,0,0,0.55);color:#fff;border-radius:6px;padding:3px 8px;font-size:13px;font-weight:600;border:1px solid rgba(255,255,255,0.2);display:none}

/* JOUEURS IA */
.ai-zone{position:absolute;display:flex;flex-direction:column;align-items:center;gap:3px}
#pTop{top:38px;left:50%;transform:translateX(-50%)}
#pLeft{left:4px;top:50%;transform:translateY(-50%)}
#pRight{right:4px;top:50%;transform:translateY(-50%)}
.ai-label{font-size:10px;color:#cfc;background:rgba(0,0,0,0.45);padding:2px 7px;border-radius:4px;white-space:nowrap}
.ai-cards{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;max-width:170px}
#pLeft .ai-cards,#pRight .ai-cards{flex-direction:column;max-width:24px}
.cb{width:20px;height:30px;background:linear-gradient(135deg,#1e3f9a,#2b5dcc);border-radius:3px;border:1px solid rgba(255,255,255,0.25);flex-shrink:0}
.turn-marker{font-size:14px;color:#ffd700;animation:blink .7s infinite alternate}
@keyframes blink{from{opacity:.3}to{opacity:1}}

/* TABLE */
#table{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:220px;height:170px;display:grid;grid-template-columns:80px 60px 80px;grid-template-rows:55px 60px 55px;place-items:center}
.pc{background:#fff;border-radius:6px;padding:4px 6px;font-size:14px;font-weight:700;min-width:36px;text-align:center;box-shadow:1px 2px 5px rgba(0,0,0,0.4);border:2px solid transparent;line-height:1.2}
.pc.win{border-color:#ffd700}
.pc.red{color:#c0392b}.pc.blk{color:#111}
.pc.trump{background:#fffbdf}

/* MAIN JOUEUR */
#hand{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:3px;flex-wrap:wrap;justify-content:center;max-width:100%;padding:0 4px}
.hc{background:#fff;border-radius:7px;padding:5px 7px;font-size:14px;font-weight:700;cursor:pointer;border:2px solid transparent;box-shadow:2px 3px 7px rgba(0,0,0,0.45);transition:transform .15s,border-color .15s;min-width:38px;text-align:center;line-height:1.2}
.hc:active{transform:translateY(-12px) scale(1.08);border-color:#ffd700}
.hc.red{color:#c0392b}.hc.blk{color:#111}
.hc.trump{background:#fffbdf}
.hc.forbidden{opacity:.35;cursor:default;pointer-events:none}
.hc.playable{border-color:rgba(100,200,100,.5)}

/* INFO BAR */
#info{position:absolute;bottom:98px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.5);color:#ffe;border-radius:6px;padding:3px 12px;font-size:12px;white-space:nowrap;max-width:90%;text-align:center}

/* ATOUT PANEL */
#tpanel{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(10,25,10,0.93);border-radius:14px;padding:18px 20px;flex-direction:column;align-items:center;gap:12px;z-index:25;min-width:230px;border:1px solid rgba(255,255,255,0.15);display:none}
#tpanel h3{color:#cfc;font-size:13px;font-weight:500;text-align:center}
#tcard{font-size:24px;background:#fff;padding:8px 14px;border-radius:8px;text-align:center;min-width:60px;font-weight:700}
#tcard.red{color:#c0392b}#tcard.blk{color:#111}
.tbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btn{background:#285c28;color:#fff;border:none;border-radius:7px;padding:9px 18px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid rgba(255,255,255,.2)}
.btn:hover{background:#3a7a3a}
.btn.pass{background:#5c2828}.btn.pass:hover{background:#7a3a3a}
.suit-btn{font-size:22px;background:#fff;border:2px solid #888;border-radius:8px;padding:7px 10px;cursor:pointer;min-width:44px;text-align:center}
.suit-btn:hover{border-color:#ffd700}
.suit-btn.red{color:#c0392b}.suit-btn.blk{color:#111}

/* MESSAGE */
#msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.85);color:#fff;border-radius:10px;padding:12px 20px;font-size:14px;font-weight:600;z-index:40;text-align:center;display:none;pointer-events:none;max-width:85%}

/* BELOTE ANNONCE */
#belote-msg{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);background:rgba(255,215,0,.95);color:#222;border-radius:10px;padding:8px 18px;font-size:15px;font-weight:700;z-index:35;display:none;text-align:center}

/* FIN DE MANCHE */
#end{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(5,15,5,0.95);border-radius:14px;padding:22px;flex-direction:column;align-items:center;gap:10px;z-index:50;min-width:270px;color:#fff;display:none;border:1px solid rgba(255,255,255,.15)}
#end h2{color:#ffd700;font-size:17px;text-align:center}
#end .det{font-size:12px;line-height:1.9;text-align:center;color:#cdc;white-space:pre-wrap}
#end .btn{margin-top:4px}

/* DERNIER PLI BTN */
#lpbtn{position:absolute;bottom:98px;right:8px;background:rgba(0,0,0,.5);color:#bbb;border-radius:5px;padding:3px 7px;font-size:11px;cursor:pointer;display:none}
#lpbtn:hover{color:#fff}
</style>
</head>
<body>
<div id="game">
  <div id="scores">
    <div class="sbox" id="sb-us"><div class="lbl">Nous</div><div class="val" id="sc-us">0</div></div>
    <div class="sbox" id="sb-th"><div class="lbl">Eux</div><div class="val" id="sc-th">0</div></div>
  </div>
  <div id="trump-ind"></div>

  <div class="ai-zone" id="pTop">
    <span class="ai-label" id="nm-top">Nord</span>
    <div class="ai-cards" id="cd-top"></div>
    <span class="turn-marker" id="tm-top" style="display:none">▼</span>
  </div>
  <div class="ai-zone" id="pLeft">
    <span class="turn-marker" id="tm-left" style="display:none">▶</span>
    <span class="ai-label" id="nm-left">Ouest</span>
    <div class="ai-cards" id="cd-left"></div>
  </div>
  <div class="ai-zone" id="pRight">
    <span class="turn-marker" id="tm-right" style="display:none">◀</span>
    <span class="ai-label" id="nm-right">Est</span>
    <div class="ai-cards" id="cd-right"></div>
  </div>

  <div id="table"></div>

  <div id="info">Chargement...</div>
  <div id="lpbtn">Dernier pli</div>
  <div id="hand"></div>

  <div id="tpanel">
    <h3 id="tp-title">Prendre ?</h3>
    <div id="tcard"></div>
    <div class="tbtns" id="tp-btns"></div>
  </div>

  <div id="end">
    <h2 id="end-title"></h2>
    <div class="det" id="end-det"></div>
    <button class="btn" onclick="newHand()">Nouvelle manche</button>
  </div>

  <div id="msg"></div>
  <div id="belote-msg"></div>
</div>

<script>
// ── CONSTANTES ────────────────────────────────────────────────
const SUITS=['♠','♥','♦','♣'];
const RANKS=['7','8','9','V','D','R','10','A'];
const SC={'♠':'blk','♥':'red','♦':'red','♣':'blk'};
const NV={'7':0,'8':0,'9':0,'V':2,'D':3,'R':4,'10':10,'A':11};
const TV={'7':0,'8':0,'9':14,'V':20,'D':3,'R':4,'10':10,'A':11};
const NO={'7':0,'8':1,'9':2,'V':3,'D':4,'R':5,'10':6,'A':7};
const TO={'7':0,'8':1,'D':2,'R':3,'10':4,'A':5,'9':6,'V':7};

// ── ÉTAT ──────────────────────────────────────────────────────
let G={};

function initG(){
  G={
    scoreUs:G.scoreUs||0, scoreThem:G.scoreThem||0,
    pending:G.pending||0,
    dealer:G.dealer||0,
    trump:null, takerTeam:null, takerPlayer:-1,
    hands:[[],[],[],[]],
    trick:[], leader:0,
    tricksWon:[0,0,0,0],
    pts:[0,0],
    belotePlayer:-1, bAnn:false, rbAnn:false,
    lastTrick:[], curP:0, phase:'trump',
    trumpCard:null, askIdx:0, trumpRound:0,
    played:[], voids:[[],[],[],[]],
    aiDelay:false
  };
}

// ── DECK ─────────────────────────────────────────────────────
function buildDeck(){
  let d=[];
  for(let s of SUITS) for(let r of RANKS) d.push({s,r});
  return shuffle(d);
}
function shuffle(a){
  for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function deal(){
  let dk=buildDeck();
  let order=[(G.dealer+1)%4,(G.dealer+2)%4,(G.dealer+3)%4,G.dealer];
  // 3 + 2 + carte retournée + 3
  for(let p of order) for(let i=0;i<3;i++) G.hands[p].push(dk.pop());
  for(let p of order) for(let i=0;i<2;i++) G.hands[p].push(dk.pop());
  G.trumpCard=dk.pop();
  for(let p of order) for(let i=0;i<3;i++) G.hands[p].push(dk.pop());
  G.leader=(G.dealer+1)%4;
  G.curP=G.leader;
}

// ── RULE ENGINE ──────────────────────────────────────────────
function allowed(player){
  let h=G.hands[player];
  if(!h||!h.length) return [];
  if(!G.trick.length) return h.slice(); // entame libre

  let lead=G.trick[0].card;
  let ls=lead.s, isTrumpLead=(ls===G.trump);
  let partner=(player+2)%4;
  let curWin=trickWinner();
  let partnerMaster=(curWin===partner);

  if(isTrumpLead){
    // Atout demandé
    let myT=h.filter(c=>c.s===G.trump);
    if(!myT.length) return h.slice(); // pas d'atout: libre
    if(partnerMaster) return h.slice(); // partenaire maître: pisse ok
    // Surcoupe obligatoire
    let hiT=highestTrumpInTrick();
    if(hiT){
      let over=myT.filter(c=>TO[c.r]>TO[hiT.r]);
      if(over.length) return over; // Cas 3
      return myT; // Cas 4: impossible surcouper, jouer atout quand même
    }
    return myT;
  } else {
    let mySuit=h.filter(c=>c.s===ls);
    if(mySuit.length) return mySuit; // Cas 1: fourniture obligatoire

    let myT=h.filter(c=>c.s===G.trump);
    if(!myT.length) return h.slice(); // Pas d'atout, pas de couleur: libre

    if(partnerMaster) return h.slice(); // Cas 5: pisse autorisée

    // Cas 2/3: coupe ou surcoupe
    let hiT=highestTrumpInTrick();
    if(hiT){
      let over=myT.filter(c=>TO[c.r]>TO[hiT.r]);
      if(over.length) return over; // Cas 3: surcoupe obligatoire
      return myT; // Cas 4: jouer atout quand même
    }
    return myT; // Cas 2: coupe
  }
}

function trickWinner(){
  if(!G.trick.length) return G.leader;
  let w=G.trick[0];
  for(let i=1;i<G.trick.length;i++){
    if(beats(G.trick[i].card,w.card)) w=G.trick[i];
  }
  return w.player;
}
function highestTrumpInTrick(){
  let ts=G.trick.filter(t=>t.card.s===G.trump);
  if(!ts.length) return null;
  return ts.reduce((b,t)=>TO[t.card.r]>TO[b.card.r]?t:b).card;
}
function beats(a,b){
  if(a.s===G.trump&&b.s!==G.trump) return true;
  if(a.s!==G.trump&&b.s===G.trump) return false;
  if(a.s===b.s) return a.s===G.trump?TO[a.r]>TO[b.r]:NO[a.r]>NO[b.r];
  return false;
}
function cv(c){return c.s===G.trump?TV[c.r]:NV[c.r];}

// ── IA ───────────────────────────────────────────────────────
function aiPick(player){
  let ok=allowed(player);
  if(!ok.length) return G.hands[player][0];

  let partner=(player+2)%4;
  let partnerMaster=G.trick.length>0&&trickWinner()===partner;
  let curWin=G.trick.length>0?trickWinner():-1;
  let myTeam=team(player);
  let isLeading=G.trick.length===0;

  // Entame
  if(isLeading){
    // As maître hors atout
    let aces=ok.filter(c=>c.r==='A'&&c.s!==G.trump);
    for(let a of aces){
      if(!G.played.some(p=>p.s===a.s&&p.r==='A')) return a;
    }
    // Tirer atout si >2 atouts en main
    let myT=ok.filter(c=>c.s===G.trump);
    if(myT.length>=3) return myT.sort((a,b)=>TO[a.r]-TO[b.r])[0];
    // Petite carte inutile
    let small=ok.filter(c=>c.s!==G.trump&&c.r!=='A'&&c.r!=='10');
    if(small.length) return small.sort((a,b)=>NO[a.r]-NO[b.r])[0];
    return ok.sort((a,b)=>cv(a)-cv(b))[0];
  }

  // Partenaire maître: charger
  if(partnerMaster){
    let big=ok.filter(c=>c.r==='A'||c.r==='10');
    if(big.length) return big.sort((a,b)=>cv(b)-cv(a))[0];
    // Ne pas pisser avec atout précieux
    let cheapNonTrump=ok.filter(c=>c.s!==G.trump&&c.r!=='A'&&c.r!=='10');
    if(cheapNonTrump.length) return cheapNonTrump.sort((a,b)=>cv(a)-cv(b))[0];
    return ok.sort((a,b)=>cv(a)-cv(b))[0];
  }

  // Adversaire maître: essayer de gagner au coût minimal
  if(curWin>=0&&team(curWin)!==myTeam){
    // Filtrer cartes qui gagnent
    let winning=ok.filter(c=>{
      let mockTrick=[...G.trick,{player,card:c}];
      let w=mockTrick[0];
      for(let t of mockTrick) if(beats(t.card,w.card)) w=t;
      return w.player===player;
    });
    if(winning.length){
      // Gagner au coût minimal, éviter gros atouts si possible
      winning.sort((a,b)=>cv(a)-cv(b));
      let cheap=winning.find(c=>!(c.s===G.trump&&(c.r==='V'||c.r==='9')));
      return cheap||winning[0];
    }
  }

  // Défausser le moins cher
  return ok.sort((a,b)=>cv(a)-cv(b))[0];
}

function team(p){return(p===0||p===2)?'us':'them';}
function teamIdx(p){return team(p)==='us'?0:1;}

// ── PRISE D'ATOUT ─────────────────────────────────────────────
function showTrumpPanel(){
  let panel=document.getElementById('tpanel');
  panel.style.display='flex';
  let order=[(G.dealer+1)%4,(G.dealer+2)%4,(G.dealer+3)%4,G.dealer];
  let asker=order[G.askIdx];
  let c=G.trumpCard;
  let tcDiv=document.getElementById('tcard');
  tcDiv.textContent=c.r+c.s;
  tcDiv.className=SC[c.s];

  let title=document.getElementById('tp-title');
  let btns=document.getElementById('tp-btns');
  btns.innerHTML='';

  if(G.trumpRound===0){
    if(asker===0){
      title.textContent='Prendre à '+c.s+' ?';
      let b1=mk('btn','Prendre',()=>doTake(0,c.s));
      let b2=mk('btn pass','Passer',()=>nextAsker(0));
      btns.append(b1,b2);
    } else {
      title.textContent=pName(asker)+' réfléchit...';
      setTimeout(()=>aiTrump1(asker),650);
    }
  } else {
    // Tour 2
    if(asker===0){
      title.textContent='Choisir l\'atout (sauf '+c.s+')';
      for(let s of SUITS){
        if(s===c.s) continue;
        let b=document.createElement('button');
        b.className='suit-btn '+SC[s];
        b.textContent=s;
        b.onclick=()=>doTake(0,s);
        btns.appendChild(b);
      }
      let bp=mk('btn pass','Passer',()=>nextAsker(1));
      btns.appendChild(bp);
    } else {
      title.textContent=pName(asker)+' réfléchit...';
      setTimeout(()=>aiTrump2(asker),650);
    }
  }
}

function aiTrump1(p){
  let c=G.trumpCard;
  let h=G.hands[p];
  let tInHand=h.filter(x=>x.s===c.s);
  let score=tInHand.length+(tInHand.some(x=>x.r==='V')?2:0)+(tInHand.some(x=>x.r==='9')?1:0);
  if(score>=2){doTake(p,c.s);return;}
  nextAsker(0);
}
function aiTrump2(p){
  let h=G.hands[p];
  let excl=G.trumpCard.s;
  let best=null,bs=0;
  for(let s of SUITS){
    if(s===excl) continue;
    let cnt=h.filter(c=>c.s===s).length;
    let hasV=h.some(c=>c.s===s&&c.r==='V');
    let sc=cnt+(hasV?2:0);
    if(sc>bs){bs=sc;best=s;}
  }
  if(bs>=2&&best){doTake(p,best);return;}
  nextAsker(1);
}

function nextAsker(round){
  G.askIdx++;
  if(G.askIdx>=4){
    if(round===0){G.trumpRound=1;G.askIdx=0;showTrumpPanel();}
    else{
      // Tout le monde passe: nouvelle donne
      G.askIdx=0;G.trumpRound=0;
      G.dealer=(G.dealer+1)%4;
      flash('Tout le monde passe — nouvelle donne',1000,()=>{startNewHand(true);});
    }
    return;
  }
  showTrumpPanel();
}

function doTake(player,suit){
  G.trump=suit;G.takerPlayer=player;G.takerTeam=team(player);
  G.phase='play';G.askIdx=0;G.trumpRound=0;
  document.getElementById('tpanel').style.display='none';
  let ti=document.getElementById('trump-ind');
  ti.textContent='Atout: '+suit;ti.style.display='block';
  detectBelote();
  setInfo(pName(player)+' prend à '+suit);
  renderAll();
  setTimeout(()=>nextTurn(),300);
}

function detectBelote(){
  G.belotePlayer=-1;
  for(let p=0;p<4;p++){
    let h=G.hands[p];
    if(h.some(c=>c.s===G.trump&&c.r==='R')&&h.some(c=>c.s===G.trump&&c.r==='D')){
      G.belotePlayer=p;break;
    }
  }
}

// ── JEU ──────────────────────────────────────────────────────
function nextTurn(){
  if(!G.hands[0].length){endHand();return;}
  G.curP=G.leader;
  renderAll();
  if(G.curP!==0){
    G.aiDelay=true;
    setTimeout(()=>{G.aiDelay=false;aiDoPlay(G.curP);},550);
  } else {
    setInfo('À vous de jouer');
  }
}

function aiDoPlay(p){
  let c=aiPick(p);
  playCard(p,c);
}

function humanPlay(card){
  if(G.phase!=='play'||G.curP!==0||G.aiDelay) return;
  let ok=allowed(0);
  if(!ok.find(c=>c===card)) return;
  playCard(0,card);
}

function playCard(player,card){
  let idx=G.hands[player].indexOf(card);
  if(idx===-1) return;
  G.hands[player].splice(idx,1);
  G.trick.push({player,card});
  G.played.push(card);

  // Belote/Rebelote
  checkBelote(player,card);

  renderAll();

  if(G.trick.length<4){
    G.curP=(player+1)%4;
    renderAll();
    if(G.curP!==0){
      G.aiDelay=true;
      setTimeout(()=>{G.aiDelay=false;aiDoPlay(G.curP);},500);
    } else {
      setInfo('À vous de jouer');
    }
  } else {
    setTimeout(()=>endTrick(),550);
  }
}

function checkBelote(player,card){
  if(G.belotePlayer!==player||card.s!==G.trump) return;
  if((card.r==='D'||card.r==='R')&&!G.bAnn){
    G.bAnn=true;
    showBeloteMsg(player,'Belote !');
  } else if((card.r==='D'||card.r==='R')&&G.bAnn&&!G.rbAnn){
    G.rbAnn=true;
    showBeloteMsg(player,'Rebelote !');
  }
}

function endTrick(){
  let winner=trickWinner();
  let pts=G.trick.reduce((s,t)=>s+cv(t.card),0);
  let ti=teamIdx(winner);
  G.pts[ti]+=pts;
  G.tricksWon[winner]++;

  // Mémoriser les couleurs épuisées
  if(G.trick.length>=2){
    let ls=G.trick[0].card.s;
    for(let t of G.trick){
      if(t.card.s!==ls&&t.card.s!==G.trump){
        if(!G.voids[t.player].includes(ls)) G.voids[t.player].push(ls);
      }
    }
  }

  G.lastTrick=G.trick.slice();
  G.trick=[];
  G.leader=winner;

  // Dernier pli +10
  if(!G.hands[0].length) G.pts[ti]+=10;

  renderAll();
  setTimeout(()=>{
    if(!G.hands[0].length) endHand();
    else{G.curP=winner;nextTurn();}
  },250);
}

// ── FIN DE MANCHE ────────────────────────────────────────────
function endHand(){
  G.phase='end';
  let up=G.pts[0], tp=G.pts[1];

  // Belote/Rebelote +20
  if(G.bAnn&&G.rbAnn){
    let bt=teamIdx(G.belotePlayer);
    if(bt===0) up+=20; else tp+=20;
  }

  let usTricks=G.tricksWon[0]+G.tricksWon[2];
  let thTricks=G.tricksWon[1]+G.tricksWon[3];
  let capot=false,capotTeam=null;
  if(usTricks===8){capot=true;capotTeam='us';}
  if(thTricks===8){capot=true;capotTeam='them';}

  let tt=G.takerTeam;
  let takerPts=tt==='us'?up:tp;
  let defPts=tt==='us'?tp:up;

  let eu=0,et=0,outcome='';

  if(capot){
    if(capotTeam===tt){
      if(tt==='us'){eu=252;outcome='🎉 Capot ! Nous gagnons tout (252 pts)';}
      else{et=252;outcome='😔 Capot ! Eux gagnent tout (252 pts)';}
    } else {
      if(tt==='us'){et=252;outcome='😮 Capot adverse ! Eux gagnent (252 pts)';}
      else{eu=252;outcome='🎉 Capot adverse ! Nous gagnons (252 pts)';}
    }
  } else if(up===81&&tp===81){
    G.pending+=81;
    outcome='⚖️ Litige ! 81-81\n'+G.pending+' pts suspendus.';
  } else {
    let dedans=(takerPts<=defPts);
    if(dedans){
      if(tt==='us'){et=162+G.pending;outcome='😔 Dedans ! Eux marquent '+(162+G.pending)+' pts';}
      else{eu=162+G.pending;outcome='🎉 Ils sont dedans ! Nous marquons '+(162+G.pending)+' pts';}
      G.pending=0;
    } else {
      eu=up+(tt==='us'?G.pending:0);
      et=tp+(tt==='them'?G.pending:0);
      G.pending=0;
      outcome='✅ Manche terminée';
    }
  }

  G.scoreUs+=eu;G.scoreThem+=et;

  let taker=pName(G.takerPlayer);
  let bLine=G.bAnn&&G.rbAnn?'\nBelote-Rebelote ✨ +20 pts':'';
  let det=`Preneur : ${taker} (${G.trump})\nNous : ${up} pts | Eux : ${tp} pts${bLine}\n\n${outcome}\n\nTotal — Nous : ${G.scoreUs} | Eux : ${G.scoreThem}`;

  document.getElementById('end-title').textContent=outcome.replace(/^[^\w]*/,'').split('\n')[0].replace(/✅|😔|🎉|😮|⚖️/g,'').trim();
  document.getElementById('end-det').textContent=det;
  document.getElementById('end').style.display='flex';
  renderAll();
}

function newHand(){
  document.getElementById('end').style.display='none';
  G.dealer=(G.dealer+1)%4;
  startNewHand(false);
}

function startNewHand(fullReset){
  let su=G.scoreUs,st=G.scoreThem,pend=G.pending,deal=G.dealer;
  initG();
  G.scoreUs=su;G.scoreThem=st;G.pending=pend;G.dealer=deal;
  deal2();
}

function deal2(){
  // Alias pour éviter conflit avec variable deal
  let dk=buildDeck();
  let order=[(G.dealer+1)%4,(G.dealer+2)%4,(G.dealer+3)%4,G.dealer];
  for(let p of order) for(let i=0;i<3;i++) G.hands[p].push(dk.pop());
  for(let p of order) for(let i=0;i<2;i++) G.hands[p].push(dk.pop());
  G.trumpCard=dk.pop();
  for(let p of order) for(let i=0;i<3;i++) G.hands[p].push(dk.pop());
  G.leader=(G.dealer+1)%4;
  G.curP=G.leader;
  renderAll();
  showTrumpPanel();
}

// ── RENDER ────────────────────────────────────────────────────
function renderAll(){
  renderHand();
  renderAI();
  renderTable();
  document.getElementById('sc-us').textContent=G.scoreUs;
  document.getElementById('sc-th').textContent=G.scoreThem;
  let lpbtn=document.getElementById('lpbtn');
  lpbtn.style.display=G.lastTrick.length?'block':'none';
}

function renderHand(){
  let div=document.getElementById('hand');
  div.innerHTML='';
  let ok=G.phase==='play'&&G.curP===0?allowed(0):[];
  let h=G.hands[0].slice();
  h.sort((a,b)=>{
    if(a.s===G.trump&&b.s!==G.trump) return 1;
    if(a.s!==G.trump&&b.s===G.trump) return -1;
    let si=SUITS.indexOf(a.s)-SUITS.indexOf(b.s);
    if(si!==0) return si;
    return NO[a.r]-NO[b.r];
  });
  for(let card of h){
    let d=document.createElement('div');
    let isTrump=card.s===G.trump;
    d.className='hc '+SC[card.s]+(isTrump?' trump':'');
    d.innerHTML=card.r+'<br><span style="font-size:12px">'+card.s+'</span>';
    let isOk=ok.find(c=>c===card);
    if(G.phase==='play'&&G.curP===0){
      if(isOk) d.classList.add('playable');
      else d.classList.add('forbidden');
    }
    if(isOk) d.onclick=()=>humanPlay(card);
    div.appendChild(d);
  }
}

function renderAI(){
  for(let [pid,cid,tmid] of [[1,'cd-left','tm-left'],[2,'cd-top','tm-top'],[3,'cd-right','tm-right']]){
    let div=document.getElementById(cid);
    div.innerHTML='';
    for(let i=0;i<G.hands[pid].length;i++){
      let d=document.createElement('div');d.className='cb';div.appendChild(d);
    }
    document.getElementById(tmid).style.display=(G.phase==='play'&&G.curP===pid)?'block':'none';
  }
}

function renderTable(){
  let div=document.getElementById('table');
  div.innerHTML='';
  // grid 3x3: positions [row,col] pour [Sud=joueur,Ouest,Nord,Est]
  let pos=[[3,2],[2,1],[1,2],[2,3]];
  let winn=G.trick.length>0?trickWinner():-1;
  for(let t of G.trick){
    let {player,card}=t;
    let [r,c]=pos[player];
    let d=document.createElement('div');
    let isTrump=card.s===G.trump;
    d.className='pc '+SC[card.s]+(isTrump?' trump':'');
    if(player===winn&&G.trick.length<4) d.classList.add('win');
    d.style.gridRow=r;d.style.gridColumn=c;
    d.textContent=card.r+card.s;
    div.appendChild(d);
  }
}

// ── HELPERS ──────────────────────────────────────────────────
function setInfo(t){document.getElementById('info').textContent=t;}
function pName(p){return['Vous','Ouest','Nord','Est'][p];}
function mk(cls,txt,fn){let b=document.createElement('button');b.className=cls;b.textContent=txt;b.onclick=fn;return b;}
function flash(txt,ms,cb){
  let d=document.getElementById('msg');
  d.textContent=txt;d.style.display='block';
  setTimeout(()=>{d.style.display='none';if(cb)cb();},ms);
}
function showBeloteMsg(player,txt){
  let d=document.getElementById('belote-msg');
  d.textContent=pName(player)+' : '+txt;d.style.display='block';
  setTimeout(()=>d.style.display='none',1100);
}

document.getElementById('lpbtn').onclick=()=>{
  if(!G.lastTrick.length) return;
  let txt='Dernier pli :\n'+G.lastTrick.map(t=>pName(t.player)+': '+t.card.r+t.card.s).join('  |  ');
  flash(txt,2200);
};

// ── DÉMARRAGE ────────────────────────────────────────────────
initG();
deal2();
</script>
